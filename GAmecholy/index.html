<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lật Thẻ Từ Vựng Anh - Việt</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card-front: #1e293b; --card-back: #4f46e5; --card-match: #059669; --card-wrong: #dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        /* Ẩn thanh cuộn toàn bộ trang */
        html, body { 
            width: 100%; height: 100vh; overflow: hidden; 
            font-family: system-ui, sans-serif; background: var(--bg); color: #fff; 
            display: flex; flex-direction: column; align-items: center; padding: 10px;
        }
        
        header { width: 100%; max-width: 1000px; background: rgba(30,41,59,0.8); padding: 8px 12px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
        .stats { display: flex; gap: 6px; flex-wrap: wrap; }
        .stat { background: rgba(15,23,42,0.6); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; text-align: center; }
        .stat span { display: block; font-weight: bold; font-size: 0.9rem; color: #38bdf8; }
        
        .controls { display: flex; gap: 6px; align-items: center; }
        .btn, select { background: #4f46e5; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
        .btn-sec { background: #334155; }
        #excel-file { display: none; }

        /* Grid tự động co giãn vừa khít màn hình, KHÔNG bị hiện thanh cuộn */
        .game-board {
            width: 100%; max-width: 1000px; height: calc(100vh - 90px);
            display: grid; gap: 6px; perspective: 1000px;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
        }
        @media (max-width: 768px) { 
            .game-board { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); } 
        }
        @media (max-width: 480px) { 
            .game-board { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(10, 1fr); gap: 4px; } 
        }

        /* Thẻ bài */
        .card { height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.3s ease; cursor: pointer; will-change: transform; }
        .card.flipped, .card.matched { transform: rotateY(180deg); }
        .card.matched { cursor: default; }
        .card.wrong { animation: shake 0.3s; }
        
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .front { background: var(--card-front); font-size: 1.2rem; color: #64748b; }
        .front::after { content: '?'; }
        .back { background: var(--card-back); transform: rotateY(180deg); word-break: break-word; }
        
        /* Giao diện khi lật ĐÚNG: Hiện "Bé giỏi quá ⭐" màu xanh */
        .card.matched .back { 
            background: var(--card-match); 
            border-color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .card.wrong .back { background: var(--card-wrong); }
        .type { font-size: 0.55rem; opacity: 0.75; text-transform: uppercase; }
        .text { font-size: clamp(0.7rem, 2vw, 0.95rem); font-weight: bold; }

        @keyframes shake { 0%,100%{transform:rotateY(180deg) translateX(0)} 25%{transform:rotateY(180deg) translateX(-4px)} 75%{transform:rotateY(180deg) translateX(4px)} }

        /* Modal chiến thắng */
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.9); display: none; align-items: center; justify-content: center; z-index: 10; }
        .modal.active { display: flex; }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 16px; text-align: center; max-width: 300px; width: 90%; }
    </style>
</head>
<body>
    <header>
        <h2 style="font-size: 1rem; color: #38bdf8;">🃏 Lật thẻ nè bé yêu</h2>
        <div class="stats">
            <div class="stat">Màn <span id="lvl">1</span></div>
            <div class="stat">Thời gian <span id="time">00:00</span></div>
            <div class="stat">Lật <span id="moves">0</span></div>
            <div class="stat">Điểm <span id="score">0/15</span></div>
        </div>
        <div class="controls">
            <select id="lvl-select"></select>
            <label for="excel-file" class="btn btn-sec">📁 Excel</label>
            <input type="file" id="excel-file" accept=".xlsx,.xls">
            <button class="btn" id="reset-btn">🔄 Lại</button>
        </div>
    </header>

    <div class="game-board" id="board"></div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h2 style="color:#fbbf24; margin-bottom:10px;">🎉 BÉ XUẤT SẮC CỰC!</h2>
            <p>Thời gian: <b id="m-time"></b> | Số lượt: <b id="m-moves"></b></p>
            <button class="btn" id="next-btn" style="width:100%; margin-top:15px;">Màn tiếp theo ➔</button>
        </div>
    </div>

    <script>
        // Sound Generator
        const snd = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(freq, type='sine', dur=0.1) {
            if (snd.state === 'suspended') snd.resume();
            const o = snd.createOscillator(), g = snd.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(0.1, snd.currentTime);
            g.gain.linearRampToValueAtTime(0.01, snd.currentTime + dur);
            o.connect(g); g.connect(snd.destination);
            o.start(); o.stop(snd.currentTime + dur);
        }

        class Game {
            constructor() {
                this.levels = { 1: [
                    {en:'Apple',vi:'Táo'},{en:'Banana',vi:'Chuối'},{en:'Orange',vi:'Cam'},{en:'Grape',vi:'Nho'},{en:'Milk',vi:'Sữa'},
                    {en:'Water',vi:'Nước'},{en:'Bread',vi:'Bánh mì'},{en:'Dog',vi:'Chó'},{en:'Cat',vi:'Mèo'},{en:'Bear',vi:'Gấu'},
                    {en:'Tiger',vi:'Hổ'},{en:'Lion',vi:'Sư tử'},{en:'Book',vi:'Sách'},{en:'Pen',vi:'Bút'},{en:'Car',vi:'Xe ô tô'}
                ]};
                this.curLvl = 1; this.flipped = []; this.matched = 0; this.moves = 0; this.sec = 0;
                this.dom = {
                    board: document.getElementById('board'), lvl: document.getElementById('lvl'), time: document.getElementById('time'),
                    moves: document.getElementById('moves'), score: document.getElementById('score'), select: document.getElementById('lvl-select'),
                    modal: document.getElementById('modal')
                };
                this.init();
            }

            init() {
                document.getElementById('excel-file').onchange = (e) => this.readExcel(e);
                document.getElementById('reset-btn').onclick = () => this.start(this.curLvl);
                document.getElementById('next-btn').onclick = () => { this.dom.modal.classList.remove('active'); this.start(this.levels[this.curLvl + 1] ? this.curLvl + 1 : 1); };
                this.dom.select.onchange = (e) => this.start(+e.target.value);
                this.renderSelect(); this.start(1);
            }

            readExcel(e) {
                const file = e.target.files[0]; if (!file) return;
                const r = new FileReader();
                r.onload = (ex) => {
                    const wb = XLSX.read(new Uint8Array(ex.target.result), {type:'array'});
                    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    this.levels = {};
                    json.forEach(row => {
                        const l = row['Màn chơi (Level)'] || row['Level'] || 1;
                        const en = row['Từ Tiếng Anh (English)'] || row['English'];
                        const vi = row['Nghĩa Tiếng Việt (Vietnamese)'] || row['Vietnamese'];
                        if (en && vi) { (this.levels[l] = this.levels[l] || []).push({en: String(en).trim(), vi: String(vi).trim()}); }
                    });
                    this.renderSelect(); this.start(+Object.keys(this.levels)[0]);
                };
                r.readAsArrayBuffer(file);
            }

            renderSelect() {
                this.dom.select.innerHTML = Object.keys(this.levels).map(l => `<option value="${l}">Màn ${l}</option>`).join('');
            }

            start(lvl) {
                this.curLvl = lvl; this.dom.lvl.textContent = lvl; this.dom.select.value = lvl;
                let pairs = this.levels[lvl] || [];
                while (pairs.length < 15 && pairs.length > 0) pairs = pairs.concat(pairs);
                pairs = pairs.slice(0, 15);

                this.cards = pairs.flatMap((p, i) => [
                    { id: i, text: p.en, type: 'EN' },
                    { id: i, text: p.vi, type: 'VI' }
                ]).sort(() => Math.random() - 0.5);

                this.reset(); this.render();
            }

            reset() {
                clearInterval(this.timer); this.sec = 0; this.moves = 0; this.matched = 0; this.flipped = []; this.lock = false;
                this.dom.time.textContent = '00:00'; this.dom.moves.textContent = '0'; this.dom.score.textContent = '0/15';
                this.timer = setInterval(() => {
                    this.sec++;
                    this.dom.time.textContent = `${String(Math.floor(this.sec/60)).padStart(2,'0')}:${String(this.sec%60).padStart(2,'0')}`;
                }, 1000);
            }

            render() {
                this.dom.board.innerHTML = '';
                this.cards.forEach((c) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.innerHTML = `
                        <div class="face front"></div>
                        <div class="face back">
                            <div class="type">${c.type}</div>
                            <div class="text">${c.text}</div>
                        </div>`;
                    el.onclick = () => this.flip(el, c);
                    this.dom.board.appendChild(el);
                });
            }

            flip(el, data) {
                if (this.lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
                el.classList.add('flipped'); playSnd(400);
                this.flipped.push({el, data});

                if (this.flipped.length === 2) {
                    this.moves++; this.dom.moves.textContent = this.moves; this.lock = true;
                    const [c1, c2] = this.flipped;
                    const isMatch = c1.data.id === c2.data.id && c1.data.type !== c2.data.type;

                    if (isMatch) {
                        setTimeout(() => {
                            // Đổi chữ trên 2 thẻ thành "Bé giỏi quá ⭐"
                            c1.el.querySelector('.back').innerHTML = '<div class="type">Khen ngợi</div><div class="text" style="color:#fef08a">Bé giỏi quá ⭐</div>';
                            c2.el.querySelector('.back').innerHTML = '<div class="type">Khen ngợi</div><div class="text" style="color:#fef08a">Bé giỏi quá ⭐</div>';

                            c1.el.classList.add('matched'); 
                            c2.el.classList.add('matched');
                            playSnd(600, 'triangle', 0.2);
                            this.matched++; this.dom.score.textContent = `${this.matched}/15`;
                            this.flipped = []; this.lock = false;
                            if (this.matched === 15) this.win();
                        }, 300);
                    } else {
                        setTimeout(() => { c1.el.classList.add('wrong'); c2.el.classList.add('wrong'); playSnd(150, 'sawtooth', 0.2); }, 200);
                        setTimeout(() => {
                            c1.el.classList.remove('flipped', 'wrong'); c2.el.classList.remove('flipped', 'wrong');
                            this.flipped = []; this.lock = false;
                        }, 800);
                    }
                }
            }

            win() {
                clearInterval(this.timer); playSnd(800, 'sine', 0.4);
                document.getElementById('m-time').textContent = this.dom.time.textContent;
                document.getElementById('m-moves').textContent = this.moves;
                this.dom.modal.classList.add('active');
            }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
