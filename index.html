<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Lật Thẻ Từ Vựng Anh - Việt (24 Thẻ)</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card-front: #1e293b; --card-back: #4f46e5; --card-match: #059669; --card-wrong: #dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        /* Dùng 100svh để không bị thanh trình duyệt di động che khuất */
        html, body { 
            width: 100%; height: 100svh; height: 100vh; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #fff; 
            display: flex; flex-direction: column; align-items: center; padding: 6px;
        }
        
        header { width: 100%; max-width: 1000px; background: rgba(30,41,59,0.85); padding: 6px 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
        .stats { display: flex; gap: 4px; }
        .stat { background: rgba(15,23,42,0.6); padding: 2px 6px; border-radius: 6px; font-size: 0.7rem; text-align: center; }
        .stat span { display: block; font-weight: bold; font-size: 0.85rem; color: #38bdf8; }
        
        .controls { display: flex; gap: 4px; align-items: center; }
        .btn, select { background: #4f46e5; color: #fff; border: none; padding: 5px 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
        .btn-sec { background: #334155; }
        #excel-file { display: none; }

        /* Tối ưu khung chứa 24 ô hiển thị chuẩn 100% trên điện thoại */
        .game-board {
            width: 100%; max-width: 1000px; flex-grow: 1;
            display: grid; gap: 4px; perspective: 1000px;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }

        /* Điện thoại chiều dọc: 3 cột x 8 hàng -> Vừa khít màn hình di động */
        @media (max-width: 480px) { 
            .game-board { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(8, 1fr); 
                gap: 4px;
            } 
        }

        /* Tablet: 4 cột x 6 hàng */
        @media (min-width: 481px) and (max-width: 768px) { 
            .game-board { 
                grid-template-columns: repeat(4, 1fr); 
                grid-template-rows: repeat(6, 1fr); 
            } 
        }

        /* Chế độ xem lại khi nhấn X (Sắp xếp 2 cột: Anh bên trái, Việt bên phải) */
        .game-board.review-mode {
            grid-template-columns: repeat(2, 1fr) !important;
            grid-template-rows: repeat(12, 1fr) !important;
            overflow-y: auto !important;
            padding-right: 2px;
        }

        /* Thẻ bài */
        .card { height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.3s ease; cursor: pointer; will-change: transform; }
        .card.flipped, .card.matched { transform: rotateY(180deg); }
        .card.matched { cursor: default; }
        .card.wrong { animation: shake 0.3s; }
        
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .front { background: var(--card-front); font-size: 1.1rem; color: #64748b; }
        .front::after { content: '?'; }
        .back { background: var(--card-back); transform: rotateY(180deg); word-break: break-word; }
        
        .card.matched .back { 
            background: var(--card-match); 
            border-color: #34d399;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }
        .card.wrong .back { background: var(--card-wrong); }
        .type { font-size: 0.5rem; opacity: 0.75; text-transform: uppercase; }
        .text { font-size: clamp(0.65rem, 2.5vw, 0.9rem); font-weight: bold; line-height: 1.1; }

        @keyframes shake { 0%,100%{transform:rotateY(180deg) translateX(0)} 25%{transform:rotateY(180deg) translateX(-4px)} 75%{transform:rotateY(180deg) translateX(4px)} }

        /* Modal chiến thắng */
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.85); display: none; align-items: center; justify-content: center; z-index: 10; }
        .modal.active { display: flex; }
        .modal-box { background: #1e293b; padding: 20px; border-radius: 16px; text-align: center; max-width: 300px; width: 90%; border: 1px solid rgba(255,255,255,0.1); }
        
        .modal-actions { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .action-btn { width: 48px; height: 48px; border-radius: 50%; border: none; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
        .btn-close { background: #ef4444; color: white; }
        .btn-next { background: #10b981; color: white; }
    </style>
</head>
<body>
    <header>
        <h2 style="font-size: 0.9rem; color: #38bdf8;">🃏 Flip Card</h2>
        <div class="stats">
            <div class="stat">Màn <span id="lvl">1</span></div>
            <div class="stat">Thời gian <span id="time">00:00</span></div>
            <div class="stat">Lật <span id="moves">0</span></div>
            <div class="stat">Điểm <span id="score">0/12</span></div>
        </div>
        <div class="controls">
            <select id="lvl-select"></select>
            <label for="excel-file" class="btn btn-sec">📁 Excel</label>
            <input type="file" id="excel-file" accept=".xlsx,.xls">
            <button class="btn" id="reset-btn">🔄 Lại</button>
        </div>
    </header>

    <div class="game-board" id="board"></div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h2 style="color:#fbbf24; margin-bottom:8px;">🎉 BÉ XUẤT SẮC CỰC!</h2>
            <p style="font-size: 0.85rem; color: #cbd5e1;">Thời gian: <b id="m-time"></b> | Số lượt: <b id="m-moves"></b></p>
            <div class="modal-actions">
                <button class="action-btn btn-close" id="btn-review" title="Tắt đi để xem lại kết quả">✖</button>
                <button class="action-btn btn-next" id="btn-continue" title="Chơi màn tiếp theo">✔</button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator
        const snd = new (window.AudioContext || window.webkitAudioContext)();
        function playSnd(freq, type='sine', dur=0.1) {
            if (snd.state === 'suspended') snd.resume();
            const o = snd.createOscillator(), g = snd.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(0.1, snd.currentTime);
            g.gain.linearRampToValueAtTime(0.01, snd.currentTime + dur);
            o.connect(g); g.connect(snd.destination);
            o.start(); o.stop(snd.currentTime + dur);
        }

        class Game {
            constructor() {
                this.levels = { 1: [
                    {en:'Apple',vi:'Táo'},{en:'Banana',vi:'Chuối'},{en:'Orange',vi:'Cam'},{en:'Grape',vi:'Nho'},
                    {en:'Milk',vi:'Sữa'},{en:'Water',vi:'Nước'},{en:'Bread',vi:'Bánh mì'},{en:'Dog',vi:'Chó'},
                    {en:'Cat',vi:'Mèo'},{en:'Bear',vi:'Gấu'},{en:'Tiger',vi:'Hổ'},{en:'Lion',vi:'Sư tử'}
                ]};
                this.curLvl = 1; this.flipped = []; this.matched = 0; this.moves = 0; this.sec = 0;
                this.dom = {
                    board: document.getElementById('board'), lvl: document.getElementById('lvl'), time: document.getElementById('time'),
                    moves: document.getElementById('moves'), score: document.getElementById('score'), select: document.getElementById('lvl-select'),
                    modal: document.getElementById('modal')
                };
                this.init();
            }

            init() {
                document.getElementById('excel-file').onchange = (e) => this.readExcel(e);
                document.getElementById('reset-btn').onclick = () => this.start(this.curLvl);
                
                document.getElementById('btn-continue').onclick = () => {
                    this.dom.modal.classList.remove('active');
                    const nextLvl = this.levels[this.curLvl + 1] ? this.curLvl + 1 : 1;
                    this.start(nextLvl);
                };

                document.getElementById('btn-review').onclick = () => {
                    this.dom.modal.classList.remove('active');
                    this.arrangeReviewMode();
                };

                this.dom.select.onchange = (e) => this.start(+e.target.value);
                this.renderSelect(); this.start(1);
            }

            readExcel(e) {
                const file = e.target.files[0]; if (!file) return;
                const r = new FileReader();
                r.onload = (ex) => {
                    const wb = XLSX.read(new Uint8Array(ex.target.result), {type:'array'});
                    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    this.levels = {};
                    json.forEach(row => {
                        const l = row['Màn chơi (Level)'] || row['Level'] || 1;
                        const en = row['Từ Tiếng Anh (English)'] || row['English'];
                        const vi = row['Nghĩa Tiếng Việt (Vietnamese)'] || row['Vietnamese'];
                        if (en && vi) { (this.levels[l] = this.levels[l] || []).push({en: String(en).trim(), vi: String(vi).trim()}); }
                    });
                    this.renderSelect(); this.start(+Object.keys(this.levels)[0]);
                };
                r.readAsArrayBuffer(file);
            }

            renderSelect() {
                this.dom.select.innerHTML = Object.keys(this.levels).map(l => `<option value="${l}">Màn ${l}</option>`).join('');
            }

            start(lvl) {
                this.curLvl = lvl; this.dom.lvl.textContent = lvl; this.dom.select.value = lvl;
                this.dom.board.classList.remove('review-mode');

                let pairs = this.levels[lvl] || [];
                while (pairs.length < 12 && pairs.length > 0) pairs = pairs.concat(pairs);
                pairs = pairs.slice(0, 12);

                this.cardsData = pairs;
                this.cards = pairs.flatMap((p, i) => [
                    { id: i, text: p.en, type: 'EN' },
                    { id: i, text: p.vi, type: 'VI' }
                ]).sort(() => Math.random() - 0.5);

                this.reset(); this.render();
            }

            reset() {
                clearInterval(this.timer); this.sec = 0; this.moves = 0; this.matched = 0; this.flipped = []; this.lock = false;
                this.dom.time.textContent = '00:00'; this.dom.moves.textContent = '0'; this.dom.score.textContent = '0/12';
                this.timer = setInterval(() => {
                    this.sec++;
                    this.dom.time.textContent = `${String(Math.floor(this.sec/60)).padStart(2,'0')}:${String(this.sec%60).padStart(2,'0')}`;
                }, 1000);
            }

            render() {
                this.dom.board.innerHTML = '';
                this.cards.forEach((c) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.dataset.id = c.id;
                    el.dataset.type = c.type;
                    el.innerHTML = `
                        <div class="face front"></div>
                        <div class="face back">
                            <div class="type">${c.type === 'EN' ? 'English' : 'Tiếng Việt'}</div>
                            <div class="text">${c.text}</div>
                        </div>`;
                    el.onclick = () => this.flip(el, c);
                    this.dom.board.appendChild(el);
                });
            }

            flip(el, data) {
                if (this.lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
                el.classList.add('flipped'); playSnd(400);
                this.flipped.push({el, data});

                if (this.flipped.length === 2) {
                    this.moves++; this.dom.moves.textContent = this.moves; this.lock = true;
                    const [c1, c2] = this.flipped;
                    const isMatch = c1.data.id === c2.data.id && c1.data.type !== c2.data.type;

                    if (isMatch) {
                        setTimeout(() => {
                            c1.el.querySelector('.back').innerHTML = `<div class="type">${c1.data.type}</div><div class="text" style="color:#fef08a">${c1.data.text}<br><small style="font-size:0.55rem; color:#a7f3d0;">Bé giỏi quá ⭐</small></div>`;
                            c2.el.querySelector('.back').innerHTML = `<div class="type">${c2.data.type}</div><div class="text" style="color:#fef08a">${c2.data.text}<br><small style="font-size:0.55rem; color:#a7f3d0;">Bé giỏi quá ⭐</small></div>`;

                            c1.el.classList.add('matched'); 
                            c2.el.classList.add('matched');
                            playSnd(600, 'triangle', 0.2);
                            this.matched++; this.dom.score.textContent = `${this.matched}/12`;
                            this.flipped = []; this.lock = false;
                            if (this.matched === 12) this.win();
                        }, 300);
                    } else {
                        setTimeout(() => { c1.el.classList.add('wrong'); c2.el.classList.add('wrong'); playSnd(150, 'sawtooth', 0.2); }, 200);
                        setTimeout(() => {
                            c1.el.classList.remove('flipped', 'wrong'); c2.el.classList.remove('flipped', 'wrong');
                            this.flipped = []; this.lock = false;
                        }, 800);
                    }
                }
            }

            win() {
                clearInterval(this.timer); playSnd(800, 'sine', 0.4);
                document.getElementById('m-time').textContent = this.dom.time.textContent;
                document.getElementById('m-moves').textContent = this.moves;
                this.dom.modal.classList.add('active');
            }

            arrangeReviewMode() {
                this.dom.board.classList.add('review-mode');
                this.dom.board.innerHTML = '';

                this.cardsData.forEach(pair => {
                    const enEl = document.createElement('div');
                    enEl.className = 'card flipped matched';
                    enEl.innerHTML = `<div class="face back"><div class="type">ENGLISH</div><div class="text">${pair.en}</div></div>`;
                    
                    const viEl = document.createElement('div');
                    viEl.className = 'card flipped matched';
                    viEl.innerHTML = `<div class="face back"><div class="type">TIẾNG VIỆT</div><div class="text">${pair.vi}</div></div>`;

                    this.dom.board.appendChild(enEl);
                    this.dom.board.appendChild(viEl);
                });
            }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
